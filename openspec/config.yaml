schema: spec-driven

context: |
  Dreamday: responsive web app for group trip planning; long-term direction is a social network
  where users browse public trips to plan their own. No users yet — rebuilt from scratch.
  Old code in apps/* is reference only; never carry over its complexity.

  Repos: specs live here (infra repo); code lives in submodules apps/backend (Rust, axum, sqlx,
  PostgreSQL) and apps/frontend (Next.js App Router, next-intl, shadcn/ui). The browser never holds
  auth tokens; Next.js calls the backend server-side.

  System-wide rules:
  - Soft delete only, never hard delete. Every deletable record has deleted_at; deleted records
    are restorable from the UI. No automatic purge. Children are not cascade-deleted: a deleted
    parent makes them inaccessible, and restoring the parent brings them back intact. Technical
    records (sessions, tokens, invitations) are marked revoked/consumed/expired instead.
    Unique constraints apply to non-deleted rows only.
  - Instants are stored and exchanged in UTC (ISO-8601 with Z). Trip dates are calendar dates.
    Schedule times are local wall time plus an IANA timezone name (never a fixed offset).
  - Money is an integer in the currency's minor unit plus an ISO 4217 code; one currency per trip.
  - Public views are separate response shapes, never a filtered internal response. They never
    expose emails, free-text notes, member lists, invitations, payers/splits, or balances.
  - Images: publicly visible images are served from a public storage area by unguessable URL
    (CDN-cacheable); private images are served from a private area by short-lived presigned URL
    issued after a permission check. Replaced/removed files move to the private area (never deleted).
    Uploads: JPEG/PNG/WebP, max 5 MB, format checked by content, re-encoded to WebP with metadata stripped.
  - Emails are shown only to their owner and to trip owners; never to other members or publicly.
  - Personal information about users (e.g. email, names, date of birth, address, phone number) and
    private content (e.g. private notes) is encrypted by the backend before it is stored:
    AES-256-GCM, a random nonce per value, stored as key_version ‖ nonce ‖ ciphertext+tag, keys
    from env. Personal information is encrypted even when it is shown publicly (e.g. display
    names). A column that must be looked up or kept unique also stores a keyed HMAC-SHA256 of its
    normalized value. Passwords are hashed with argon2id and random tokens with SHA-256, never
    encrypted. Other public content (e.g. public trip content) stays in plain text. Each change's
    design lists its encrypted columns.
  - UI: mobile-first responsive for mobile, tablet, and laptop; Be Vietnam Pro font; all UI copy
    and date/number/currency formatting localized in English and Vietnamese.
  - Backend module boundaries: one deployable backend organized as feature modules. A module
    queries only its own tables; other modules get its data by calling the public functions of
    its service, never by writing SQL against its tables. Shared code never depends on a
    feature module. External services (email, storage, maps, routing, AI) are reached through a
    trait held in the app state, with a fake implementation for tests.
  - YAGNI: specify only what the current change needs; put "later" ideas in Out of scope.

rules:
  proposal:
    - Write in Vietnamese
    - Always include Out of scope and Open questions sections
  specs:
    - Write requirement and scenario prose in Vietnamese; keep SHALL/MUST, WHEN/THEN keywords
    - Give every requirement a stable ID (<CAPABILITY>-R<n>) and every scenario an ID (<CAPABILITY>-S<n>); never reuse IDs
    - Cover permission (owner/member/viewer/public) and data-boundary scenarios for every read and write
  design:
    - Only record decisions that are not obvious from the specs; skip design.md when there are none
  tasks:
    - Each capability starts with tasks that write failing tests for its scenarios, referencing scenario IDs
    - Keep each task small enough for a reviewable PR (under ~400 changed lines)

operations:
  apply:
    guidance:
      - Write or update failing tests before implementation code (TDD)
      - Do not implement behavior that no scenario requires
      - Use the latest stable versions of the toolchain, frameworks, and libraries (Rust stable with the latest edition, newest crate and npm releases); add dependencies with `cargo add` / `pnpm add` without pinning old versions, and check crates.io or npm for the current release instead of relying on remembered version numbers
      - The backend doubles as the owner's Rust learning project, so prefer plain, explicit code over macros and clever abstractions, and explain each Rust concept the first time a task uses it
