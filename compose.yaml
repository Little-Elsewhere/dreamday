services:
  backend-db:
    image: postgres:18-alpine
    env_file:
      - ./env/backend/.env
    environment:
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - backend_postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dreamday-local

  backend-mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - dreamday-local

  # Local S3-compatible object store (RustFS). Production swaps the same
  # S3_* env vars to Cloudflare R2 — no app code change.
  backend-rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      # Keep in sync with S3_ACCESS_KEY / S3_SECRET_KEY in env/backend/.env
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - backend_rustfs_data:/data
    networks:
      - dreamday-local

  backend-migrate:
    image: dreamday-backend:local
    env_file:
      - ./env/backend/.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      backend-db:
        condition: service_healthy
    restart: "no"
    networks:
      - dreamday-local
    volumes:
      - type: bind
        source: ./apps/backend
        target: /app

  frontend:
    image: dreamday-frontend:local
    build:
      context: ./apps/frontend
      dockerfile: docker/dev/Dockerfile
    env_file:
      - ./env/frontend/.env
    ports:
      - "4000:4000"
    networks:
      - dreamday-local
    volumes:
      - type: bind
        source: ./apps/frontend
        target: /app
      - type: volume
        source: frontend_node_modules
        target: /app/node_modules
      - type: volume
        source: frontend_next
        target: /app/.next

  backend:
    image: dreamday-backend:local
    build:
      context: ./apps/backend
      dockerfile: docker/dev/Dockerfile
    env_file:
      - ./env/backend/.env
    ports:
      - "8000:8000"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      backend-mailpit:
        condition: service_started
      backend-rustfs:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - dreamday-local
    volumes:
      - type: bind
        source: ./apps/backend
        target: /app

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - backend-rustfs
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
    networks:
      - dreamday-local

networks:
  dreamday-local:
    driver: bridge

volumes:
  frontend_node_modules:
  frontend_next:
  backend_postgres18_data:
  backend_rustfs_data:
