services:
  frontend:
    image: dreamday-frontend:local
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    env_file:
      - ./apps/frontend/.env
    ports:
      - "3000:3000"
    networks:
      - dreamday-local

  backend:
    image: dreamday-backend:local
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    env_file:
      - ./apps/backend/.env
    ports:
      - "8000:8000"
    networks:
      - dreamday-local

networks:
  dreamday-local:
    driver: bridge
