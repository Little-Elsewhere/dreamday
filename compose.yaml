services:
  frontend:
    image: dreamday-frontend:local
    build:
      context: ./apps/frontend
      dockerfile: docker/dev/Dockerfile
    env_file:
      - ./env/frontend/.env
    secrets:
      - source: frontend_doppler_token
        target: doppler_token
    ports:
      - "4000:4000"
    networks:
      - dreamday-local
    volumes:
      - type: bind
        source: ./apps/frontend
        target: /app
      - type: volume
        source: frontend_node_modules
        target: /app/node_modules
      - type: volume
        source: frontend_next
        target: /app/.next

  backend:
    image: dreamday-backend:local
    build:
      context: ./apps/backend
      dockerfile: docker/dev/Dockerfile
    env_file:
      - ./env/backend/.env
    ports:
      - "8000:8000"
    networks:
      - dreamday-local

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
    networks:
      - dreamday-local

networks:
  dreamday-local:
    driver: bridge

volumes:
  frontend_node_modules:
  frontend_next:

secrets:
  frontend_doppler_token:
    file: ./env/frontend/doppler_token
